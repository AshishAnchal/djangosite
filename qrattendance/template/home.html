<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase | Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f5f5f5;
        }

        /* Navbar */
        header {
            background-color: #222;
            color: #fff;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: #ff9800;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 16px;
        }

        nav a:hover {
            color: #ff9800;
        }

        /* Hero Section */
        .hero {
            background: url("https://images.unsplash.com/photo-1512436991641-6745cdb1723f") center/cover no-repeat;
            height: 350px;
            display: flex;
            align-items: center;
            padding-left: 60px;
            color: white;
        }

        .hero-content h2 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .hero-content p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .hero-content button {
            padding: 12px 25px;
            border: none;
            background-color: #ff9800;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        .hero-content button:hover {
            background-color: #e68900;
        }

        /* Products */
        .products {
            padding: 40px;
        }

        .products h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 5px;
        }

        .product-card h3 {
            margin: 10px 0;
        }

        .product-card p {
            color: green;
            font-weight: bold;
        }

        .product-card button {
            margin-top: 10px;
            padding: 8px 15px;
            border: none;
            background-color: #222;
            color: white;
            cursor: pointer;
            border-radius: 4px;
        }

        .product-card button:hover {
            background-color: #ff9800;
        }

        /* Footer */
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <header>
        <h1>ShopEase</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">Cart</a>
            <a href="#">Login</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h2>Big Sale 50% Off</h2>
            <p>Best products at the best prices</p>
            <button>Shop Now</button>
        </div>
    </section>

    <!-- Products Section -->
    <section class="products">
        <h2>Featured Products</h2>

        <div class="product-grid">
            <div class="product-card">
                <img src="https://via.placeholder.com/300" alt="Product">
                <h3>Product 1</h3>
                <p>₹999</p>
                <button>Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/300" alt="Product">
                <h3>Product 2</h3>
                <p>₹1499</p>
                <button>Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/300" alt="Product">
                <h3>Product 3</h3>
                <p>₹799</p>
                <button>Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/300" alt="Product">
                <h3>Product 4</h3>
                <p>₹1999</p>
                <button>Add to Cart</button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 ShopEase. All Rights Reserved.</p>
    </footer>

</body>
</html>
